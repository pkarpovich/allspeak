name: Allspeak
options:
  bundleIdPrefix: dev.karpovich
  deploymentTarget:
    iOS: "26.0"
    watchOS: "26.0"
  createIntermediateGroups: true
  developmentLanguage: en
  fileTypes:
    icon:
      file: true
settings:
  base:
    SWIFT_VERSION: "6.0"
    SWIFT_STRICT_CONCURRENCY: complete
    ENABLE_USER_SCRIPT_SANDBOXING: YES
    IPHONEOS_DEPLOYMENT_TARGET: "26.0"
    MARKETING_VERSION: "1.0.0"
    CURRENT_PROJECT_VERSION: "1"
    DEVELOPMENT_TEAM: GGG699AY79
targets:
  Allspeak:
    type: application
    platform: iOS
    deploymentTarget: "26.0"
    sources:
      - path: Allspeak
      - path: AllspeakLiveActivity/TogglePlaybackIntent.swift
    dependencies:
      - target: AllspeakWatch
        embed: true
      - target: AllspeakLiveActivity
        embed: true
    configFiles:
      Debug: Allspeak/Signing.xcconfig
      Release: Allspeak/Signing.xcconfig
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: dev.karpovich.allspeak
        TARGETED_DEVICE_FAMILY: "1"
        INFOPLIST_FILE: Allspeak/Info.plist
        GENERATE_INFOPLIST_FILE: NO
        SUPPORTS_MACCATALYST: NO
        SUPPORTS_MAC_DESIGNED_FOR_IPHONE_IPAD: NO
        ENABLE_PREVIEWS: YES
        ASSETCATALOG_COMPILER_APPICON_NAME: Allspeak
        INFOPLIST_KEY_ITSAppUsesNonExemptEncryption: false
    scheme:
      testTargets:
        - AllspeakTests
      gatherCoverageData: true
  AllspeakTests:
    type: bundle.unit-test
    platform: iOS
    deploymentTarget: "26.0"
    sources:
      - path: AllspeakTests
    dependencies:
      - target: Allspeak
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: dev.karpovich.allspeak.tests
        CODE_SIGNING_ALLOWED: NO
        GENERATE_INFOPLIST_FILE: YES
  AllspeakWatch:
    type: application
    platform: watchOS
    deploymentTarget: "26.0"
    sources:
      - path: AllspeakWatch
      - path: Allspeak/Allspeak.icon
      - path: Allspeak/Models/Subtitle.swift
      - path: Allspeak/Watch/WireProtocol.swift
      - path: Allspeak/Watch/PlaybackSnapshot.swift
      - path: Allspeak/Watch/CueCache.swift
      - path: Allspeak/Watch/WatchMessageSender.swift
      - path: Allspeak/Watch/WatchSessionClient.swift
      - path: Allspeak/Watch/SkipCoalescer.swift
      - path: Allspeak/Watch/SessionURLParser.swift
    configFiles:
      Debug: AllspeakWatch/Signing.xcconfig
      Release: AllspeakWatch/Signing.xcconfig
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: dev.karpovich.allspeak.watchkitapp
        TARGETED_DEVICE_FAMILY: "4"
        INFOPLIST_FILE: AllspeakWatch/Info.plist
        GENERATE_INFOPLIST_FILE: NO
        WATCHOS_DEPLOYMENT_TARGET: "26.0"
        ENABLE_PREVIEWS: YES
        ASSETCATALOG_COMPILER_APPICON_NAME: Allspeak
        INFOPLIST_KEY_ITSAppUsesNonExemptEncryption: false
        SDKROOT: watchos
        SUPPORTS_XR_DESIGNED_FOR_IPHONE_IPAD: NO
  AllspeakLiveActivity:
    type: app-extension
    platform: iOS
    deploymentTarget: "26.0"
    sources:
      - path: AllspeakLiveActivity
      - path: Allspeak/Audio/AllspeakActivityAttributes.swift
      - path: Allspeak/Design/Tokens.swift
    configFiles:
      Debug: AllspeakLiveActivity/Signing.xcconfig
      Release: AllspeakLiveActivity/Signing.xcconfig
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: dev.karpovich.allspeak.liveactivity
        TARGETED_DEVICE_FAMILY: "1"
        INFOPLIST_FILE: AllspeakLiveActivity/Info.plist
        GENERATE_INFOPLIST_FILE: NO
        SUPPORTS_MACCATALYST: NO
        SKIP_INSTALL: YES
        INFOPLIST_KEY_ITSAppUsesNonExemptEncryption: false
        INFOPLIST_KEY_NSHumanReadableCopyright: ""
        LD_RUNPATH_SEARCH_PATHS: "$(inherited) @executable_path/Frameworks @executable_path/../../Frameworks"
        SWIFT_ACTIVE_COMPILATION_CONDITIONS: "$(inherited) WIDGET_EXTENSION"
